name: Snapshot Old

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run outside hours (1 = yes)"
        required: false
        default: "0"

  schedule:
    # 6:00 AM PH = 22:00 UTC
    - cron: "0 22 * * *"

# 🔒 REQUIRED: shared lock for ALL snapshot workflows
concurrency:
  group: snapshot-main
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install firebase-admin

      - name: Run snapshot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: node scripts/snapshot-old.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          git commit -m "snapshot: old" || echo "No changes"
          git push
