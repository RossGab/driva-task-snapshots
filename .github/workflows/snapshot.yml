name: Firebase Task Snapshots

on:
  workflow_dispatch:
  schedule:
  # Today & Today-1 → every 30 minutes (6AM–10PM PH)
  - cron: "*/30 22-23,0-14 * * *"

  # Today-2 & Today-3 → every 2 hours (6AM–10PM PH)
  - cron: "0 22-23/2,0-14/2 * * *"

  # Day-4 & Day-5 → every 3 hours (6AM–10PM PH)
  - cron: "0 22-23/3,0-14/3 * * *"

  # Day-6 & Day-7 → every 5 hours (6AM–10PM PH)
  - cron: "0 22-23/5,0-14/5 * * *"

  # Day-8+ → once per day at 6:00 AM PH
  - cron: "0 22 * * *"

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm install firebase-admin

      - name: Run snapshot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/snapshot.js

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add snapshots

          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
          else
            git commit -m "chore: update task snapshots"
            git push
          fi
