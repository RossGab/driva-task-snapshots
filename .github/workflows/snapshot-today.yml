name: Snapshot Today

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run outside hours"
        required: false
        default: "0"

  repository_dispatch:
    types: [trigger-snapshot]

  schedule:
    - cron: "*/30 22-23,0-13 * * *"

# 🔒 Global lock for ALL snapshot workflows
concurrency:
  group: snapshot-main
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install firebase-admin

      - name: Run snapshot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: node scripts/snapshot-today.js

      # ✅ FIXED COMMIT STEP
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add snapshots

          # Nothing changed → exit cleanly
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi

          git commit -m "snapshot: today"

          # 🔥 THIS IS THE MISSING PIECE
          git pull --rebase origin main

          git push
