name: Snapshot Drivers

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run outside hours (1 = yes)"
        required: false
        default: "0"

  schedule:
    # Every 30 minutes
    # PH 6:00 AM – 9:59 PM  →  UTC 22–13
    - cron: "*/30 22-23,0-13 * * *"

# 🔒 SHARED LOCK (prevents git push conflicts)
concurrency:
  group: snapshot-main
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install firebase-admin

      - name: Run driver snapshot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: node scripts/snapshot-drivers.js

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add snapshots/drivers.json snapshots/drivers-latest.json
          git commit -m "snapshot: drivers" || echo "No changes"

          git push
