name: Snapshot Recent

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run outside hours (1 = yes)"
        required: false
        default: "0"

  schedule:
  # 3× per day (PH 6AM, 12PM, 6PM)
    - cron: "0 22,4,10 * * *"

# 🔒 REQUIRED LOCK (shared with other snapshot workflows)
concurrency:
  group: snapshot-main
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install firebase-admin

      - name: Run snapshot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: node scripts/snapshot-recent.js

      # ✅ SAFE COMMIT STEP
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add snapshots

          # No changes → exit cleanly
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi

          git commit -m "snapshot: recent"

          # 🔥 REQUIRED to avoid fetch-first errors
          git pull --rebase origin main

          git push
