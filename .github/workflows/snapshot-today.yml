name: Snapshot Today

on:
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force run outside hours (1 = yes)"
        required: false
        default: "0"

  schedule:
    # Every 30 minutes (PH 6AM–9PM = UTC 22–13)
    - cron: "*/30 22-23,0-13 * * *"

# 🔒 ADD THIS BLOCK (TOP LEVEL)
concurrency:
  group: snapshot-main
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - run: npm install firebase-admin

      - name: Run snapshot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
        run: node scripts/snapshot-today.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          git commit -m "snapshot: today" || echo "No changes"
          git push
