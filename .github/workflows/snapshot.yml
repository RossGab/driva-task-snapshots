name: Firebase Task Snapshots

on:
  workflow_dispatch:
  schedule:
    # 🇵🇭 Philippine Time = UTC+8
    # 6:00–22:00 every 30 mins (UTC 22:00–14:00)
    - cron: "*/30 22-23,0-14 * * *"
    # today-2 → every 2 hours
    - cron: "0 */2 * * *"
    # today-3 → every 4 hours
    - cron: "0 */4 * * *"
    # older → once a day (02:00 PH)
    - cron: "0 18 * * *"

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install deps
        run: npm install firebase-admin

      - name: Run snapshot
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/snapshot.js

      - name: Commit snapshots
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add snapshots/*.json
          git commit -m "📸 Update task snapshots" || echo "No changes"
          git push
